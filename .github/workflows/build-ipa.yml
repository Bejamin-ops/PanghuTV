name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install CocoaPods deps (MobileVLCKit)
        run: pod install --repo-update

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -workspace PanghuTV.xcworkspace \
            -scheme PanghuTV \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log || { tail -n 120 build.log; exit 1; }

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PanghuTV.app Payload/
          zip -qry PanghuTV-unsigned.ipa Payload
          ls -lh PanghuTV-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: PanghuTV-unsigned-ipa
          path: PanghuTV-unsigned.ipa
          if-no-files-found: error
