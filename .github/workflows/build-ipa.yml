name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Inspect project & schemes
        run: |
          xcodegen generate
          xcodebuild -list || true

      - name: Install CocoaPods deps (MobileVLCKit)
        run: |
          ok=0
          for i in 1 2 3 4; do
            echo "== pod attempt $i =="
            if pod install --repo-update; then ok=1; break; fi
            rm -rf Pods Podfile.lock
            sleep 15
          done
          [ "$ok" = "1" ] || { echo "pod install failed after retries"; exit 1; }

      - name: List schemes (debug)
        run: |
          xcodebuild -workspace PanghuTV.xcworkspace -list || true

      - name: Build (unsigned)
        run: |
          set -o pipefail
          if xcodebuild -workspace PanghuTV.xcworkspace -list | grep -q "PanghuTV"; then
            BUILDARGS="-workspace PanghuTV.xcworkspace -scheme PanghuTV"
          elif xcodebuild -project PanghuTV.xcodeproj -list | grep -q "PanghuTV"; then
            echo "workspace scheme missing, using -project -scheme"
            BUILDARGS="-project PanghuTV.xcodeproj -scheme PanghuTV"
          else
            echo "no scheme anywhere, using -project -target"
            BUILDARGS="-project PanghuTV.xcodeproj -target PanghuTV -configuration Release"
          fi
          echo "BUILDARGS=$BUILDARGS"
          xcodebuild $BUILDARGS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log || { tail -n 120 build.log; exit 1; }

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PanghuTV.app Payload/
          zip -qry PanghuTV-unsigned.ipa Payload
          ls -lh PanghuTV-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: PanghuTV-unsigned-ipa
          path: PanghuTV-unsigned.ipa
          if-no-files-found: error
